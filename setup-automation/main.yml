---
- name: Create inventory
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Add bastion host
    ansible.builtin.add_host:
      name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
      ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
      ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
      ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
      ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
- name: Demo Playbook for the ansible-runner API
  hosts: all:!localhost
  gather_facts: false
  tasks:

  - ansible.builtin.wait_for_connection:
  - name: Simple debug task
    ansible.builtin.debug:
      msg: "Hello Runner"

  - name: Set config_host variable with ansible_host value
    set_fact:
      config_host: "{{ ansible_host }}"

  - name: Create a directory if it does not exist
    ansible.builtin.file:
      path: "/tmp/setup-scripts/"
      state: directory
      mode: '0755'

  - name: Check if setup-server.sh exists
    ansible.builtin.stat:
      path: "./setup-{{ config_host }}.sh"
    delegate_to: localhost
    register: r_script_test

  - name: Copy script file
    when: r_script_test.stat.exists
    copy:
      src: "./setup-{{ ansible_host }}.sh"
      dest: "/tmp/setup-scripts/setup-{{ ansible_host }}.sh"
    register: r_result

  - name: Check if secrets file exists
    ansible.builtin.stat:
      path: ../config/secrets.yaml
    delegate_to: localhost
    register: r_secrets_test

  - name: Include secrets
    include_vars: ../config/secrets.yaml
    when: r_secrets_test.stat.exists

  - name: Set default secret values if secrets file doesn't exist
    set_fact:
      zerossl_eab_key_id: "{{ lookup('ansible.builtin.env', 'ZEROSSL_EAB_KEY_ID') }}"
      zerossl_hmac_key: "{{ lookup('ansible.builtin.env', 'ZEROSSL_HMAC_KEY') }}"
    when: not r_secrets_test.stat.exists

  - name: Execute setup script if it exists
    when: r_script_test.stat.exists
    shell: "sh /tmp/setup-scripts/setup-{{ ansible_host }}.sh"
    become: true
    register: r_result
    ignore_errors: true
    environment:
      REGISTRY_PULL_TOKEN: "{{ lookup('ansible.builtin.env', 'REGISTRY_PULL_TOKEN') }}"
      GUID: "{{ lookup('ansible.builtin.env', 'GUID') }}"
      DOMAIN: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
      ZEROSSL_EAB_KEY_ID: "{{ zerossl_eab_key_id }}"
      ZEROSSL_HMAC_KEY: "{{ zerossl_hmac_key }}"
      GIT_REPO: "{{ lookup('ansible.builtin.env', 'GIT_REPO_URL') }}"
      GIT_BRANCH: "{{ lookup('ansible.builtin.env', 'GIT_REPO_REF') }}"

  - name: Display script output
    ansible.builtin.debug:
      msg: "{{ r_result.stdout_lines }}"
    when:
    - r_result is defined
    - r_result.stdout is defined

  - name: Display script errors
    ansible.builtin.debug:
      msg: "{{ r_result.stderr_lines }}"
    when:
    - r_result is defined
    - r_result.stderr is defined

  - name: Fail if stage was failed
    ansible.builtin.fail:
      msg: "Setup script failed with exit code {{ r_result.rc }}. Check log output above."
    when:
    - r_result is defined
    - r_result.rc != 0
