<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Bootable image build pipeline</title>
  <desc id="desc">From Containerfile to bootc image to qcow2 disk to running VM</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A4A4A"/>
    </marker>
  </defs>
  <rect width="1100" height="360" rx="18" fill="#F7F7F7"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#151515">Production build path in this lab</text>
  <text x="40" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6A6E73">Focus on the artifact at each stage  that is what Image Mode standardizes</text>

  <!-- step 1 -->
  <rect x="30" y="110" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="2"/>
  <circle cx="60" cy="145" r="16" fill="#C9190B"/>
  <text x="60" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#151515">Containerfile</text>
  <text x="50" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">rhel-bootc base</text>
  <text x="50" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">COPY app + service</text>
  <text x="50" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">enable on boot</text>

  <line x1="270" y1="190" x2="310" y2="190" stroke="#4A4A4A" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- step 2 -->
  <rect x="320" y="110" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="2"/>
  <circle cx="350" cy="145" r="16" fill="#C9190B"/>
  <text x="350" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="380" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#151515">bootc image</text>
  <text x="340" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">podman build</text>
  <text x="340" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">lamp-bootc:latest</text>
  <text x="340" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">~2 GB OS + app</text>

  <line x1="560" y1="190" x2="600" y2="190" stroke="#4A4A4A" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- step 3 -->
  <rect x="610" y="110" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="2"/>
  <circle cx="640" cy="145" r="16" fill="#C9190B"/>
  <text x="640" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="670" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#151515">qcow2 disk</text>
  <text x="630" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">bootc-image-builder</text>
  <text x="630" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">disk.qcow2</text>
  <text x="630" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">810 minute wait</text>

  <line x1="850" y1="190" x2="890" y2="190" stroke="#4A4A4A" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- step 4 -->
  <rect x="900" y="110" width="170" height="160" rx="12" fill="#FFFFFF" stroke="#C9190B" stroke-width="3"/>
  <circle cx="930" cy="145" r="16" fill="#C9190B"/>
  <text x="930" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="958" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#151515">VM</text>
  <text x="920" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">virt-install</text>
  <text x="920" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">boot ’ serve</text>
  <text x="920" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4A4A">no manual setup</text>

  <text x="40" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6A6E73">Why this matters: one tagged bootable image becomes a repeatable virtual machine deployment.</text>
</svg>
